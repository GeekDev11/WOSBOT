name: Whiteout Stats integration tests

on:
  push:
    branches:
      - modified
      - development
      - feature/whiteoutstats-intelligence
  pull_request:
    paths:
      - "cogs/wos_*.py"
      - "main.py"
      - "tests/test_wos_*.py"
      - "tests/test_alliance_intel_export.py"
      - "tests/test_bundled_theme.py"
      - "themes/**"
      - "cogs/pimp_my_bot.py"
      - "cogs/bot_profile.py"
      - "cogs/bot_main_menu.py"
      - "tests/test_bot_profile.py"
      - "cogs/alliance_member_operations.py"
      - "cogs/alliance_intel_export.py"
      - "cogs/wos_versioning.py"
      - "requirements.txt"
      - ".github/workflows/wos-intelligence-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whiteout-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Syntax validation
        run: |
          python -m compileall -q cogs/wos_intelligence.py cogs/wos_alliance_intel.py cogs/wos_leaderboards.py cogs/wos_player_history.py cogs/wos_svs.py cogs/wos_observations.py cogs/alliance_api_sync.py cogs/alliance_api_menu.py cogs/alliance_member_operations.py cogs/alliance_intel_export.py cogs/bot_profile.py cogs/bot_main_menu.py
      - name: Run focused tests
        run: |
          python -m pytest -q tests/test_wos_intelligence.py tests/test_wos_alliance_intel.py tests/test_wos_leaderboards.py tests/test_wos_player_history.py tests/test_wos_svs.py tests/test_wos_deployment.py tests/test_wos_observations.py tests/test_alliance_intel_export.py tests/test_bundled_theme.py tests/test_bot_profile.py
