name: Staged minister and Sync History verification

on:
  push:
    branches:
      - feature/minister-self-service-and-sync-history
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Syntax validation
        run: python -m compileall -q cogs main.py tests
      - name: Minister and Player Sync regression
        run: |
          python -m pytest -q tests/test_minister_self_service.py tests/test_minister_booking.py tests/test_player_sync.py tests/test_alliance_registration.py
